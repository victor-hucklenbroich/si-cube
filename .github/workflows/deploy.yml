name: Deploy to GitHub Pages

# Deploys the tagged commit of a published release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" \
              || { echo "::error::No release found to deploy."; exit 1; }
            echo "Manual run — deploying latest release: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.idea' \
            --exclude='node_modules' --exclude='_site' --exclude='tools' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='README.md' --exclude='LICENSE' \
            --exclude='.gitignore' --exclude='.DS_Store' \
            ./ _site/

      - name: Render icons
        run: node tools/render-icon.mjs

      - name: Stamp release version
        run: node tools/set-version.mjs _site/index.html "${{ steps.release.outputs.tag }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
