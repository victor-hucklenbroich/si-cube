<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="owP5_JeMH11U_YJ5N60rf3nh5cwTQQBfVnATqDtGSLc" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page" data-i18n="page">Silicon Cube - Si Crystal Planes &amp; Miller Indices | TUM MW0080</title>
  <meta name="description" content="Interactive 3D visualization of silicon crystal planes and Miller indices, with angles between crystallographic planes. Study tool for the TUM lecture MW0080 – Microsensors &amp; Actuators (Mikrotechnische Sensoren und Aktoren).">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LearningResource",
    "name": "Silicon Cube · TUM MW0080",
    "description": "Interactive 3D visualization of silicon crystal planes and Miller indices, with angles between crystallographic planes. Study tool for the TUM lecture MW0080 Microsensors & Actuators (Mikrotechnische Sensoren und Aktoren).",
    "url": "https://victor-hucklenbroich.github.io/si-cube/",
    "inLanguage": ["en", "de"],
    "isAccessibleForFree": true,
    "learningResourceType": "Interactive 3D visualization",
    "keywords": ["Silicon Cube", "Silizium Würfel", "TUM", "MW0080", "Microsensors & Actuators", "Mikrotechnische Sensoren und Aktoren", "Miller indices", "silicon crystal planes", "crystallography"],
    "author": { "@type": "Person", "name": "Victor Hucklenbroich" }
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "918adf159b7840f18ebc4d56bc25d51a"}'></script>
</head>
<body>
  <div id="canvas-container">
    <div id="toolbar">
      <button id="btn-lang" title="Deutsch / English"></button>
      <button id="btn-theme" title="Light / Dark"></button>
    </div>

    <div id="canvas-footer">
      <div class="footer-inner">
        <div id="version-text">
          <span class="ver">dev</span>
          <span class="ver-sep">·</span>
          <button id="impressum-link" type="button" data-i18n="impressum"></button>
        </div>

        <div id="controls-hint">
          <span class="ctrl"><span class="ctrl-icon m">◧</span><span class="ctrl-icon t">↻</span><span data-i18n="rotate"></span></span>
          <span class="sep">·</span>
          <span class="ctrl"><span class="ctrl-icon m">◨</span><span class="ctrl-icon t">◉</span><span data-i18n="select"></span></span>
          <span class="sep">·</span>
          <span class="ctrl"><span class="ctrl-icon">◎</span><span data-i18n="zoom"></span></span>
        </div>
      </div>
    </div>
  </div>

  <div id="side-panel">
    <div id="panel-header">
      <div class="element-tile" aria-hidden="true">
        <span class="el-num">14</span>
        <span class="el-sym">Si</span>
        <span class="el-mass">28.09</span>
      </div>
      <div class="header-text">
        <h1 data-i18n="title"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>

    <div id="current-face" style="display:none;">
      <div class="hud-label" id="face-label" data-i18n="reference"></div>
      <div style="display:flex;align-items:baseline;gap:12px;">
        <div id="facing-index" class="miller-big">(1 0 0)</div>
        <div id="facing-family" class="family-tag family-100">{100}</div>
      </div>
    </div>

    <div id="angle-table">
      <div class="angle-header">
        <div class="header-left">
          <span class="hud-label" data-i18n="angles"></span>
          <span class="info-wrapper">
            <button class="info-btn" type="button" aria-label="Show formula" aria-expanded="false">i</button>
            <div class="info-popup" id="formula-popup" role="dialog" aria-label="Angle formula">
              <div class="formula" id="formula"></div>
              <div class="formula-legend">
                <div><span class="leg-key">(h, k, l)</span> = <span data-i18n="formula_plane1"></span></div>
                <div><span class="leg-key">(h′, k′, l′)</span> = <span data-i18n="formula_plane2"></span></div>
              </div>
            </div>
          </span>
        </div>
        <button id="clear-btn" title="Clear (Esc)" aria-label="Clear selection">×</button>
      </div>
      <div id="angle-list"></div>
    </div>

    <div id="panel-footer">
      <div id="legend">
        <div class="legend-item"><span class="swatch-100"></span><span class="fam">{100}</span></div>
        <div class="legend-item"><span class="swatch-110"></span><span class="fam">{110}</span></div>
        <div class="legend-item"><span class="swatch-111"></span><span class="fam">{111}</span></div>
      </div>
    </div>
  </div>

  <div class="info-popup" id="calc-popup" role="dialog" aria-label="Angle calculation">
    <div class="calc-header" id="calc-header"></div>
    <div class="formula" id="calc-formula"></div>
  </div>

  <div id="impressum-overlay">
    <div id="impressum-modal" role="dialog" aria-modal="true" aria-labelledby="impressum-title">
      <button id="impressum-close" type="button" aria-label="Close">×</button>
      <h2 id="impressum-title" data-i18n="impressum"></h2>
      <div id="impressum-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
